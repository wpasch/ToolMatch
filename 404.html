<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — ToolMatch</title>
    <meta name="robots" content="noindex" />

    <!-- Absolute for the same reason the link below is: this file answers for
         paths at any depth, and a relative icon href would chase the missing
         path instead of the site. -->
    <link
      rel="icon"
      href="https://wpasch.github.io/ToolMatch/assets/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="icon" href="https://wpasch.github.io/ToolMatch/assets/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#3d6ec2" />

    <!-- Deliberately self-contained: no stylesheet, no webfont, no script.
         GitHub Pages serves this file for any missing path under the project,
         including deep ones like /ToolMatch/a/b/c. Relative asset paths would
         resolve against the requested path rather than this file and 404 in
         turn, so the page would lose its styling in precisely the case it
         exists to handle. The type stack falls back to system fonts for the
         same reason. -->
    <style>
      :root {
        color-scheme: light dark;
        --paper: light-dark(#f4f4f2, #101216);
        --ink: light-dark(#16181d, #f2f2ef);
        --muted: light-dark(#6a6f78, #969ba4);
        --coral: light-dark(#dd5540, #ff7d67);
        --sky-deep: light-dark(#3d6ec2, #24305c);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.4rem;
        padding: 2rem 1.5rem;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        font-size: 1.0625rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 34rem;
      }
      .mark {
        width: 2rem;
        height: 2rem;
        margin-bottom: 1.75rem;
        fill: var(--sky-deep);
      }
      h1 {
        margin: 0 0 0.6rem;
        font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
        font-size: clamp(2.4rem, 7vw, 3.6rem);
        font-weight: 400;
        line-height: 1.06;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .home {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-top: 1.75rem;
        padding: 0.6rem 1.1rem;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
      }
      .home:hover {
        background: var(--coral);
      }
      .note {
        margin-top: 1.5rem;
        font-size: 0.9375rem;
      }
      .note code {
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        background: light-dark(#e6e6e2, #262a31);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="mark" viewBox="0 0 73 76" aria-hidden="true">
        <path d="M73 0 L0 38.5 L35 41 L48 76 Z" />
      </svg>

      <h1>That page isn't here.</h1>
      <p>
        ToolMatch is a single page — the whole catalog lives on it, so there was
        probably never a page at this address.
      </p>

      <!-- Absolute, because a relative href from /ToolMatch/a/b/c would point
           at a sibling of the missing path rather than at the site. -->
      <a class="home" href="https://wpasch.github.io/ToolMatch/">Go to the directory</a>

      <p class="note">
        Looking for one tool? Every card has a copy-link button, and those links
        look like <code>?tool=perplexity</code>.
      </p>
    </div>
  </body>
</html>
