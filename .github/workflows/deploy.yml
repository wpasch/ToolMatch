name: Deploy to Pages

# Makes publishing explicit. The site is static and has no build step, so
# this uploads the repository as-is — but only after the same checks a pull
# request runs, so a catalog that fails validation cannot reach production.
#
# One-time setup: Settings → Pages → Source must be "GitHub Actions". Until
# that is switched over, this workflow fails at the deploy step and the
# branch-based publish stays in charge.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait for the one in flight rather than cancel it —
# cancelling mid-publish is how a half-uploaded site happens.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
